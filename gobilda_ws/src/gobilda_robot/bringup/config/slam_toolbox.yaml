slam_toolbox:
  ros__parameters:
    use_sim_time: false

    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    mode: mapping
    resolution: 0.05
    max_laser_range: 12.0
    minimum_laser_range: 0.2
    transform_publish_period: 0.02
    map_update_interval: 5.0